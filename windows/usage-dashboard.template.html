<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Quota Management</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--panel:#141415;--ink:#f4f4f5;--ink2:#d4d4d8;--muted:#8b8b94;--grid:#26262a;--btn:#1c1c1f;--btnon:#f4f4f5;--btnonink:#0b0b0c;--warn:#fbbf24;--c-claude:#f4906b;--c-codex:#6ea8ff;--c-grok:#a1a1aa;--c-gemini:#a78bfa}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f7f7f5;--panel:#fff;--ink:#18181b;--ink2:#3f3f46;--muted:#71717a;--grid:#e4e4e7;--btn:#efeff0;--btnon:#18181b;--btnonink:#fff;--warn:#b45309;--c-claude:#c2410c;--c-codex:#2563eb;--c-grok:#52525b;--c-gemini:#7c3aed}}
:root[data-theme="light"]{color-scheme:light;--bg:#f7f7f5;--panel:#fff;--ink:#18181b;--ink2:#3f3f46;--muted:#71717a;--grid:#e4e4e7;--btn:#efeff0;--btnon:#18181b;--btnonink:#fff;--warn:#b45309;--c-claude:#c2410c;--c-codex:#2563eb;--c-grok:#52525b;--c-gemini:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
button,select{font:inherit;color:var(--ink2);background:var(--btn);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink2);outline-offset:2px}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
button[aria-pressed="true"]{background:var(--btnon);color:var(--btnonink)}
button:disabled{opacity:.6;cursor:default}
.top{display:flex;justify-content:flex-end;gap:4px}
.top button{background:none;padding:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.row.t{align-items:baseline}
.grow{margin-left:auto}
h1{font-size:28px;margin:0;line-height:1.1}
.sub,.lbl,.note,.of,.muted{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{display:inline-flex;gap:8px;align-items:center}
.btns .primary{background:var(--btnon);color:var(--btnonink)}
.btns button[aria-pressed="true"]{background:var(--btnon);color:var(--btnonink)}
.tabs button,.seg button{background:none}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--btn);color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{display:inline-flex;gap:8px;align-items:center;padding:8px 12px}
.tabs button span.n{color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px}
select{background:var(--panel);color:var(--ink);padding:9px 12px}
.range{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.range button{background:var(--panel);padding:8px 14px}
.range button.i{padding:8px 10px;background:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}
.drift{margin:8px 0 0;font-size:13px;color:var(--warn)}
.msg{margin-top:12px;color:var(--warn);min-height:0}
.panel{background:var(--panel);border-radius:16px;padding:20px;margin-top:16px}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.ph .nm{display:flex;gap:10px;align-items:center;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{background:none;padding:6px 12px}
.chips button em{font-style:normal;color:var(--muted);margin-left:6px}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--ink)}
.chips button[aria-pressed="true"] em{color:var(--muted)}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-end;margin-top:8px}
.big{font-size:52px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.of{font-size:18px;margin-left:8px}
.stat{text-align:right}.stat b{display:block;font-size:20px;font-weight:500}
.chart{position:relative;margin-top:12px}
svg.c{display:block;width:100%;height:auto;overflow:visible}
svg text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif}
.hit{touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:13px;white-space:nowrap;display:none;transform:translate(-50%,-125%);z-index:2}
.note{font-size:13px;margin:8px 0 0}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);padding:4px 0}
.wrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td small{display:block;color:var(--muted);font-size:12px}
li small{color:var(--muted);font-size:12px;margin-left:6px}
td.w{color:var(--warn)}
ul.nl{margin:12px 0 0;padding-left:20px;color:var(--muted)}
@media (max-width:600px){.panel{padding:14px}.big{font-size:42px}h1{font-size:24px}}
</style>
</head>
<body>
<main id="app"></main>
<script id="data" type="application/json">__DATA__</script>
<script>__SIM__</script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('q2' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('q2' + k, v); } catch (e) {} }
};
let D = JSON.parse($('data').textContent);
const MULTS = [['1', 'Same as now (×1)'], ['0.5', 'Half (×0.5)'], ['1.5', '1.5× (×1.5)'], ['2', 'Double (×2)'], ['0', 'Stop (×0, only resets)']];
const pick = (v, ok, d) => ok.includes(v) ? v : d;
const ui = {
  tab: store.get('tab', 'all'),
  view: pick(store.get('view', 'rem'), ['rem', 'drain'], 'rem'),
  win: pick(store.get('win', '3'), ['1', '3', '6', '24'], '3'),
  mult: pick(store.get('mult', '1'), MULTS.map(m => m[0]), '1'),
  emails: store.get('emails', '0') === '1',
  theme: pick(store.get('theme', 'system'), ['system', 'light', 'dark'], 'system'),
  lim: (() => { try { return JSON.parse(store.get('lim', '{}')) || {}; } catch (e) { return {}; } })()
};
let off = 0, busy = false, msg = '', charts = {};
const closed = {}; // provider id -> accounts <details> was collapsed by the viewer

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loc = (t, o) => new Date(t * 1000).toLocaleString([], o);
const fmtDT = t => loc(t, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtWT = t => loc(t, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const fmtD = t => loc(t, { month: 'short', day: 'numeric' });
const ago = t => { const s = D.now - t; return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 172800 ? (s / 3600).toFixed(1) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const nm = a => quotaSeat(a, ui.emails, esc);
const num = v => Math.round(v * 10) / 10;

const ICON = {
  reload: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  auto: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>',
  grid: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

function applyTheme() {
  const r = document.documentElement;
  if (ui.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', ui.theme);
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
}

function chart(p, lim, W) {
  const H = 340, L = 52, R = 12, T = 30, B = 30, pw = W - L - R;
  const d0 = new Date((D.now - 7 * 86400 + off) * 1000); d0.setHours(0, 0, 0, 0);
  const d1 = new Date(d0); d1.setDate(d1.getDate() + 14);
  const x0 = d0 / 1000, x1 = d1 / 1000;
  const X = t => L + (t - x0) / (x1 - x0) * pw;
  const drain = ui.view === 'drain';
  const mult = parseFloat(ui.mult), rate = lim.burn ? lim.burn[ui.win] : null;
  const cap = lim.cap || 100;
  const hist = drain ? [] : lim.hist.filter(q => q[0] >= x0 && q[0] <= x1);
  const dr = drain ? ((lim.drain || {})[ui.win] || []).filter(q => q[0] >= x0 && q[0] <= x1) : [];
  let pr = null;
  if (!drain && rate != null && x1 > D.now && lim.seats && lim.seats.length) {
    pr = quotaProject(lim.seats, rate * mult, D.now, x1 - D.now);
    pr.pts = pr.pts.filter(q => q[0] >= x0 && q[0] <= x1);
  }
  const ymax = drain ? niceMax(Math.max(0, ...dr.map(q => q[1]))) : cap;
  const Y = v => T + (1 - Math.min(Math.max(v, 0), ymax) / ymax) * (H - T - B);
  const yl = v => drain ? num(v) + '%/h' : Math.round(v) + '%';
  const s = [];
  for (const v of [0, ymax / 2, ymax]) s.push(`<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" fill="var(--muted)">${yl(v)}</text>`);
  const ppd = pw / 14;
  for (const d = new Date(d0); d < d1;) {
    const n = new Date(d); n.setDate(n.getDate() + 1);
    const a = d / 1000, b = n / 1000, day = d.getDate();
    s.push(`<line x1="${X(a)}" x2="${X(a)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/>`);
    if (ppd >= 22 || day % 2) s.push(`<text x="${(X(a) + X(b)) / 2}" y="${H - 10}" text-anchor="middle" fill="var(--muted)">${ppd >= 52 ? d.toLocaleDateString([], { weekday: 'short', day: 'numeric' }) : day}</text>`);
    d.setTime(n.getTime());
  }
  s.push(`<line x1="${X(x1)}" x2="${X(x1)}" y1="${T}" y2="${H - B}" stroke="var(--grid)"/>`);
  const pt = q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1);
  let anyB = false;
  if (hist.length) {
    const runs = [];
    for (const q of hist) {
      const b = q[2] ? 1 : 0; let r = runs[runs.length - 1];
      if (!r || r.b !== b) { const nr = { b, pts: [] }; if (r) nr.pts.push(r.pts[r.pts.length - 1]); runs.push(nr); r = nr; }
      r.pts.push(q);
    }
    for (const r of runs) {
      if (r.pts.length < 2) continue;
      if (r.b) anyB = true;
      const l = r.pts.map(pt).join(' ');
      s.push(`<g${r.b ? ' opacity=".55"' : ''}><polygon points="${X(r.pts[0][0])},${Y(0)} ${l} ${X(r.pts[r.pts.length - 1][0])},${Y(0)}" fill="url(#g-${esc(p.id)})"/><polyline points="${l}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"${r.b ? ' stroke-dasharray="1 4" stroke-linecap="round"' : ''}/></g>`);
    }
  }
  if (dr.length) s.push(`<polyline points="${dr.map(pt).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>`);
  if (pr && pr.pts.length > 1) s.push(`<polyline points="${pr.pts.map(pt).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 5"/>`);
  if (D.now >= x0 && D.now <= x1) s.push(`<line x1="${X(D.now)}" x2="${X(D.now)}" y1="${T}" y2="${H - B + 4}" stroke="var(--muted)"/><text x="${X(D.now)}" y="${T - 10}" text-anchor="middle" fill="var(--muted)">Now</text>`);
  let emptyTxt = '';
  if (pr && pr.empty && pr.empty >= x0 && pr.empty <= x1) {
    const ex = X(pr.empty), tx = Math.min(Math.max(ex, L + 70), W - R - 70);
    emptyTxt = 'Empty ' + fmtWT(pr.empty);
    s.push(`<circle cx="${ex}" cy="${Y(0)}" r="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><text x="${tx}" y="${Y(0) - 12}" text-anchor="middle" fill="var(--ink)" stroke="var(--panel)" stroke-width="4" paint-order="stroke">${emptyTxt}</text>`);
  }
  if (drain && !dr.length) s.push(`<text x="${L + pw / 2}" y="${(T + H - B) / 2}" text-anchor="middle" fill="var(--muted)">not enough history in this range</text>`);
  s.push(`<line class="cx" y1="${T}" y2="${H - B}" stroke="var(--ink2)" visibility="hidden"/><circle class="cd" r="5" fill="var(--acc)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/><rect class="hit" x="${L}" y="0" width="${pw}" height="${H}" fill="transparent"/>`);
  const cand = drain ? dr.map(q => [q[0], q[1], 'd']) : hist.map(q => [q[0], q[1], q[2] ? 'b' : 'r']).concat(pr ? pr.pts.map(q => [q[0], q[1], 'p']) : []);
  charts[p.id] = { W, H, L, R, x0, x1, X, Y, cand };
  const label = drain ? `${lim.label} drain rate over the last ${ui.win} hours` : `${lim.label}: ${Math.round(lim.now)}% of ${cap}% left now` + (emptyTxt ? ', projected ' + emptyTxt.toLowerCase() : '');
  const notes = [];
  if (!drain) {
    notes.push('Solid: recorded');
    if (anyB) notes.push('dotted: rebuilt from the rotation log');
    if (pr) notes.push('dashed: projected at ' + (mult === 0 ? 'no further usage' : ui.win + 'h burn ×' + ui.mult));
  } else notes.push('Burn rate over ' + ui.win + 'h, evaluated hourly');
  const young = !drain && hist.length < 2 ? `<p class="note">History starts ${lim.hist.length ? esc(fmtDT(lim.hist[0][0])) : 'now'}; the line fills in as readings arrive every 5 minutes.</p>` : '';
  return `<div class="chart" data-p="${esc(p.id)}"><svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="g-${esc(p.id)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".32"/><stop offset="1" stop-color="var(--acc)" stop-opacity=".02"/></linearGradient></defs>${s.join('')}</svg><div class="tip"></div></div><p class="note">${notes.join(' · ')}</p>${young}`;
}

function accounts(p) {
  const wl = {}, ids = [];
  for (const a of p.accounts) for (const w of a.windows) if (!wl[w.id]) { wl[w.id] = w.label; ids.push(w.id); }
  ids.sort((a, b) => 'swfm'.indexOf(a) - 'swfm'.indexOf(b));
  const anyNote = p.accounts.some(a => a.note);
  const rows = p.accounts.map(a => {
    const cells = ids.map(id => {
      const w = a.windows.find(x => x.id === id);
      if (!w) return '<td>–</td>';
      return `<td>${w.used == null ? '–' : Math.round(w.used * 100) + '%'}${w.reset ? `<small>resets ${esc(fmtWT(w.reset))}</small>` : ''}</td>`;
    }).join('');
    return `<tr><td>${nm(a)}</td>${cells}<td>${a.readAt ? 'Read ' + esc(ago(a.readAt)) : '–'}</td>${anyNote ? `<td class="w">${esc(a.note)}</td>` : ''}</tr>`;
  }).join('');
  return `<details data-p="${esc(p.id)}"${closed[p.id] ? '' : ' open'}><summary>Accounts</summary><div class="wrap"><table><thead><tr><th>Account</th>${ids.map(id => `<th>${esc(wl[id])}</th>`).join('')}<th>Read</th>${anyNote ? '<th>Note</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}

function panel(p, W) {
  const lim = p.limits.find(l => l.id === ui.lim[p.id]) || p.limits[0];
  let h = `<section class="panel" style="--acc:var(--c-${esc(p.id)})"><div class="ph"><div class="nm"><span class="dot"></span><b>${esc(p.name)}</b><span class="muted">${p.total} account${p.total === 1 ? '' : 's'}</span></div>`;
  h += `<div class="chips">${p.limits.map(l => `<button data-a="lim" data-p="${esc(p.id)}" data-v="${esc(l.id)}" aria-pressed="${l === lim}">${esc(l.label)}<em>${Math.round(l.now)}%</em></button>`).join('')}</div></div>`;
  if (p.note) h += `<p class="note">${esc(p.note)}</p>`;
  if (lim) {
    const b = lim.burn ? lim.burn[ui.win] : null;
    h += `<div class="hd"><div><span class="big">${Math.round(lim.now)}%</span><span class="of">of ${lim.cap}%</span></div><div class="stat"><span class="muted">Burn, last ${ui.win}h</span><b>${b == null ? 'not enough history yet' : num(b) + '%/h'}</b></div></div>`;
    h += chart(p, lim, W);
  } else {
    h += `<p class="muted">No usage data yet.</p>` + (p.accounts.some(a => a.note) ? `<ul class="nl">${p.accounts.filter(a => a.note).map(a => `<li>${nm(a)}: ${esc(a.note)}</li>`).join('')}</ul>` : '');
  }
  return h + accounts(p) + '</section>';
}

function render() {
  charts = {};
  applyTheme();
  const ps = D.providers || [];
  if (ui.tab !== 'all' && !ps.some(p => p.id === ui.tab)) ui.tab = 'all';
  const tot = ps.reduce((a, p) => a + p.total, 0), ld = ps.reduce((a, p) => a + p.loaded, 0);
  const app = $('app'), narrow = innerWidth < 600;
  const W = Math.max(280, Math.min(1100, app.clientWidth || 1068) - 32 - (narrow ? 28 : 40));
  const d0 = new Date((D.now - 7 * 86400 + off) * 1000); d0.setHours(0, 0, 0, 0);
  const d1 = new Date(d0); d1.setDate(d1.getDate() + 14);
  const themeIco = { system: 'auto', light: 'sun', dark: 'moon' }[ui.theme];
  const nextTheme = { system: 'light', light: 'dark', dark: 'system' }[ui.theme];
  const seg = (a, items, cur) => items.map(([v, l]) => `<button data-a="${a}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('');
  const show = ps.filter(p => ui.tab === 'all' || p.id === ui.tab);
  app.innerHTML =
    `<div class="top"><button data-a="reload" aria-label="Reload data" title="Reload data (updated ${esc(fmtDT(D.now))})">${ico('reload')}</button>` +
    `<button data-a="theme" aria-label="Theme: ${ui.theme}, switch to ${nextTheme}" title="Theme: ${ui.theme}">${ico(themeIco)}</button></div>` +
    `<div class="row t"><h1>Quota Management</h1><span class="sub">${tot} credential${tot === 1 ? '' : 's'} · ${ld} loaded</span><div class="btns grow">` +
    `<button data-a="emails" aria-pressed="${ui.emails}">${ico('eye')}Show emails</button>` +
    (D.app ? `<button class="primary" data-a="refresh"${busy ? ' disabled' : ''}>${ico('reload')}${busy ? 'Refreshing…' : 'Refresh all credentials'}</button>` : '') +
    `</div></div>` + (D.drift ? `<p class="drift">Live rotator files differ from the repo (${D.drift.n}): ${esc(D.drift.names.join(', '))}. Run rotator-sync --check.</p>` : '') +
    `<div class="msg" role="status">${esc(msg)}</div>` +
    `<div class="row tabs" role="group" aria-label="Provider"><button data-a="tab" data-v="all" aria-pressed="${ui.tab === 'all'}">${ico('grid')}All <span class="n">${tot}</span></button>` +
    ps.map(p => `<button data-a="tab" data-v="${esc(p.id)}" aria-pressed="${ui.tab === p.id}" style="--acc:var(--c-${esc(p.id)})"><span class="dot"></span>${esc(p.name)} <span class="n">${p.total}</span></button>`).join('') + `</div>` +
    `<div class="row"><div class="seg" role="group" aria-label="View">${seg('view', [['rem', 'Remaining'], ['drain', 'Drain rate']], ui.view)}</div>` +
    `<div class="seg" role="group" aria-label="Burn rate window"><span class="lbl" style="padding:6px 10px">Burn rate</span>${seg('win', [['1', '1h'], ['3', '3h'], ['6', '6h'], ['24', '24h']], ui.win)}</div>` +
    `<label class="lbl">Future usage <select data-a="mult">${MULTS.map(([v, l]) => `<option value="${v}"${v === ui.mult ? ' selected' : ''}>${l}</option>`).join('')}</select></label>` +
    `<div class="range grow"><span class="muted">${esc(fmtD(d0 / 1000))} to ${esc(fmtD(d1 / 1000 - 43200))}</span><button class="i" data-a="shift" data-v="-7" aria-label="Earlier">${ico('left')}</button><button data-a="today">Today</button><button class="i" data-a="shift" data-v="7" aria-label="Later">${ico('right')}</button></div></div>` +
    (show.length ? show.map(p => panel(p, W)).join('') : '<section class="panel"><p class="muted">No credentials found.</p></section>');
  for (const el of app.querySelectorAll('.chart')) hover(el);
}

function hover(el) {
  const c = charts[el.dataset.p]; if (!c) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cx = svg.querySelector('.cx'), cd = svg.querySelector('.cd'), hit = svg.querySelector('.hit');
  const hide = () => { tip.style.display = 'none'; cx.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); };
  const move = e => {
    if (!c.cand.length) return;
    const r = svg.getBoundingClientRect(), k = r.width / c.W;
    const t = c.x0 + ((e.clientX - r.left) / k - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
    let q = c.cand[0]; for (const z of c.cand) if (Math.abs(z[0] - t) < Math.abs(q[0] - t)) q = z;
    const px = c.X(q[0]), py = c.Y(q[1]);
    cx.setAttribute('x1', px); cx.setAttribute('x2', px); cd.setAttribute('cx', px); cd.setAttribute('cy', py);
    cx.setAttribute('visibility', 'visible'); cd.setAttribute('visibility', 'visible');
    const val = q[2] === 'd' ? num(q[1]) + '%/h' : Math.round(q[1]) + '% left' + (q[2] === 'p' ? ' (projected)' : q[2] === 'b' ? ' (rebuilt)' : '');
    tip.textContent = fmtDT(q[0]) + ' · ' + val;
    tip.style.display = 'block'; tip.style.top = (py * k) + 'px';
    tip.style.left = Math.min(Math.max(px * k, tip.offsetWidth / 2 + 2), r.width - tip.offsetWidth / 2 - 2) + 'px';
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}

async function loadData() {
  if (!D.app) { location.reload(); return; }
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    D = await r.json(); msg = '';
  } catch (e) { msg = 'Could not reload data.'; }
  render();
}

async function refreshAll() {
  busy = true; msg = ''; render();
  try {
    const r = await fetch('/api/refresh', { method: 'POST', headers: { 'X-Quota-App': '1' } });
    if (r.status === 409) msg = 'A refresh is already running.';
    else if (!r.ok) msg = 'Refresh failed (' + r.status + ').';
    else D = await r.json();
  } catch (e) { msg = 'Refresh failed: could not reach the app.'; }
  busy = false; render();
}

function act(a, v, el) {
  if (a === 'reload') return loadData();
  if (a === 'refresh') return refreshAll();
  if (a === 'theme') { ui.theme = { system: 'light', light: 'dark', dark: 'system' }[ui.theme]; store.set('theme', ui.theme); }
  else if (a === 'emails') { ui.emails = !ui.emails; store.set('emails', ui.emails ? '1' : '0'); }
  else if (a === 'tab') { ui.tab = v; store.set('tab', v); }
  else if (a === 'view') { ui.view = v; store.set('view', v); }
  else if (a === 'win') { ui.win = v; store.set('win', v); }
  else if (a === 'mult') { ui.mult = v; store.set('mult', v); }
  else if (a === 'lim') { ui.lim[el.dataset.p] = v; store.set('lim', JSON.stringify(ui.lim)); }
  else if (a === 'shift') off += parseInt(v, 10) * 86400;
  else if (a === 'today') off = 0;
  else return;
  render();
}

document.addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) act(b.dataset.a, b.dataset.v, b); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.a === 'mult') act('mult', e.target.value, e.target); });
document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.p) closed[d.dataset.p] = !d.open; }, true);
let rt, lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(render, 120); });

if (D.app) {
  const m = document.querySelector('meta[http-equiv="refresh"]'); if (m) m.remove();
  setInterval(() => { if (!busy) loadData(); }, 60000);
}
render();
</script>
</body>
</html>
